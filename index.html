<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mensch at the Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen chat. Brand band on top, conversation in the middle, reply bar pinned below. Single warm-editorial look by choice. */
:root{
  --cream:#F5F0E8; --navy:#1B2A4A; --gold:#C9A84C; --white:#FFFFFF;
  --line:rgba(27,42,74,.22); --soft:rgba(27,42,74,.62);
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--cream);color:var(--navy);font-family:var(--f-body);font-size:15px;line-height:1.5}
.app{height:100%;height:100dvh;min-height:480px;display:flex;flex-direction:column;max-width:680px;margin:0 auto;padding-inline:16px;box-sizing:border-box}
header{display:flex;align-items:center;gap:14px;padding-block:14px 12px;border-bottom:1.5px solid var(--line)}
header img{width:112px;height:auto;flex:none}
.brand{min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--soft)}
#log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:18px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.msg{max-width:86%;padding:11px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;min-width:0}
.bot{align-self:flex-start;background:var(--white);border:1.5px solid var(--line)}
.me{align-self:flex-end;background:var(--navy);color:var(--white)}
.thinking{color:var(--soft);font-style:italic}
.card{align-self:flex-start;width:min(100%,380px);background:var(--white);border:1.5px solid var(--navy);border-radius:12px;padding:14px;display:grid;gap:10px;box-sizing:border-box}
.card .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--soft);font-weight:500}
.card .pic{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--cream);display:block}
.card .go{font-size:12.5px;color:var(--soft)}
.card h2{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.card .price{font-weight:700;font-variant-numeric:tabular-nums}
.card .row{display:flex;flex-wrap:wrap;gap:8px}
.card .q{background:var(--cream);border-radius:8px;padding:8px 10px;font-size:14px}
.card .note{font-size:12.5px;color:var(--soft)}
.card .list{display:grid;gap:2px}
.card .li{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);color:var(--navy);text-decoration:none;font-size:14px}
.card .li .nm{display:flex;align-items:center;gap:10px;min-width:0}
.card .li img{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:var(--cream)}
.card .li:last-child{border-bottom:0}
.card .li:hover{text-decoration:underline}
.card .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:10px;font:700 14px var(--f-body);text-decoration:none;cursor:pointer;border:1.5px solid var(--navy)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.ghost{background:var(--white);color:var(--navy)}
.btn:focus-visible,.chip:focus-visible,#send:focus-visible,#box:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
#chips{display:flex;flex-wrap:wrap;gap:8px;padding-block:4px 6px;flex:none}#chips:empty{display:none}
.chip{background:var(--white);color:var(--navy);border:1.5px solid var(--navy);border-radius:12px;padding:8px 12px;font:500 13.5px var(--f-body);cursor:pointer}
.chip:hover{background:var(--navy);color:var(--white)}
form{display:flex;gap:8px;padding-block:6px calc(12px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line)}
#box{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:15px var(--f-body);color:var(--navy);background:var(--white)}
#send{background:var(--navy);color:var(--white);border:0;border-radius:10px;padding:0 16px;font:700 14px var(--f-body);cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
.foot{font-size:11.5px;color:var(--soft);padding-block:0 8px}
@media (max-width:600px){
  header{padding-block:8px 8px;gap:10px}
  header img{width:64px!important}
  .brand h1{font-size:18px!important}
  .brand p{display:none}
  .foot{font-size:11.5px;padding-block:0 4px}.foot-more{display:none}

  body{font-size:17.5px;line-height:1.55}
  header img{width:84px}
  .brand h1{font-size:19px}
  .brand p{font-size:13.5px}
  .msg{max-width:94%;padding:12px 15px}
  .card{width:100%;padding:16px}
  .card h2{font-size:19px}
  .card .price{font-size:17px}
  .card .li{font-size:16.5px;padding:11px 2px}
  .card .note{font-size:14px}
  .card .q{font-size:16.5px}
  .btn{min-height:48px;font-size:16px}
  .chip{font-size:16px;padding:10px 14px}
  #box{font-size:17px;padding:12px 14px}
  #send{font-size:16px;padding:0 18px}
  .foot{font-size:13px}
}
@media (prefers-reduced-motion:no-preference){.msg,.card{animation:in .22s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
</head><body>
